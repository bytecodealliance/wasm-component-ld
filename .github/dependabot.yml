version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    groups:
      wasm-tools:
        applies-to: version-updates
        patterns:
          - "wasm*"
          - "wit*"
          - "wat*"
          - "wasi*"
